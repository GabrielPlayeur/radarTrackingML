[project]
name = "radar-tracking-ml"
version = "0.1.0"
description = "Pistage radar maritime : quelles briques d'un filtre de Kalman l'IA peut-elle améliorer ? (projet d'apprentissage)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "packaging>=25.0",
    "scipy>=1.15",
    "sympy>=1.14.0",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    # filterpy : référence de comparaison, UNIQUEMENT utilisé dans tests/
    "filterpy>=1.4.5",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/radar",
    "src/sim",
    "src/tracking",
    "src/learned",
    "src/metrics",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
